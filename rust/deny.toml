# cargo-deny configuration. CI runs `cargo deny --all-features check`.
# The modules ship inside an Apache-2.0 Go module, so every license must be
# permissive and compatible with Apache-2.0. Copyleft licenses, weak or
# strong, are not allowed.

[graph]
# The targets that this workspace builds: the modules, and the native
# benchmark on Linux.
targets = ["wasm32-wasip1", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]


[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
