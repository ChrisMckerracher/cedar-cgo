# cargo-about configuration. scripts/third-party-licenses.sh writes
# THIRD_PARTY_LICENSES.txt from it: the license of every crate that the
# WebAssembly modules contain.
accepted = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0", "Zlib"]
targets = ["wasm32-wasip1"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
