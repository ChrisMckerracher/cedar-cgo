[package]
name = "cgw-verification"
description = "Independent pinned Cedar and SymCC fixture oracles and benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
autobins = false

[dependencies]
cedar-policy = { workspace = true, features = ["tpe"] }
cedar-policy-core.workspace = true
cedar-policy-formatter.workspace = true
cedar-policy-symcc.workspace = true
cgw-abi.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

