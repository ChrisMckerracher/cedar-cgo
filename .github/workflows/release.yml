name: Release

# Manual runs verify the release pipeline without publishing a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CORPUS_COMMIT: 1999ea249229e26cabb398a279fea721854a471d
  CORPUS_SHA256: 65476adf952c0574d6bf9b317d67d30c9ac462eb1dbf5e4c7b2a35856baf5205
  CVC5_URL: https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
  CVC5_SHA256: 1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI for the exact release commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          record=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=push -f branch=main -f head_sha="$GITHUB_SHA" -f per_page=1 \
            --jq '.workflow_runs[0] | [.id, .head_sha, .head_branch, .event, .status, .conclusion] | @tsv')
          read -r run_id source branch event status conclusion <<< "$record"
          test "$source" = "$GITHUB_SHA"
          test "$branch" = main && test "$event" = push
          test "$status" = completed && test "$conclusion" = success
          results=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            --jq '.jobs[].conclusion')
          test -n "$results"
          while read -r result; do test "$result" = success; done <<< "$results"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build and compare independent modules
        run: scripts/check-wasm-reproducibility.sh "$RUNNER_TEMP/wasm-artifact"
      - name: Verify and install the build outputs
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/wasm-artifact"
          go run ./cmd/verify-wasm-artifact "$artifact" "$GITHUB_SHA"
          for name in authorizer analysis; do
            cp "$artifact/$name/$name.wasm" "$artifact/$name/sha256.go" "internal/modules/$name/"
          done
      - name: Download verified test inputs
        run: |
          set -euo pipefail
          curl -sSfL -o corpus.tar.gz "https://raw.githubusercontent.com/cedar-policy/cedar-integration-tests/$CORPUS_COMMIT/corpus-tests.tar.gz"
          echo "$CORPUS_SHA256  corpus.tar.gz" | sha256sum --check
          mkdir corpus && tar xzf corpus.tar.gz -C corpus
          curl -sSfL -o cvc5.zip "$CVC5_URL"
          echo "$CVC5_SHA256  cvc5.zip" | sha256sum --check
          unzip -q cvc5.zip
      - name: Test the generated modules
        run: |
          set -euo pipefail
          CEDAR_CORPUS_DIR="$PWD/corpus" CVC5="$PWD/cvc5-Linux-x86_64-static/bin/cvc5" go test -count=1 ./...
      - name: Verify source bundle rejection behavior
        run: python3 -m unittest discover -s scripts/consumer -p 'test_*.py'
      - name: Package and test the consumer bundle
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/wasm-artifact"
          go run ./cmd/verify-wasm-artifact "$artifact" "$GITHUB_SHA"
          for name in authorizer analysis; do
            cmp "$artifact/$name/$name.wasm" "internal/modules/$name/$name.wasm"
            cmp "$artifact/$name/sha256.go" "internal/modules/$name/sha256.go"
          done
          mkdir dist
          python3 scripts/package-consumer.py "$artifact" "$GITHUB_SHA" dist/cedar-go-wasm-source.zip
          scripts/check-consumer.sh dist/cedar-go-wasm-source.zip "$GITHUB_SHA"
          cp "$artifact/authorizer/authorizer.wasm" "$artifact/analysis/analysis.wasm" "$artifact/SOURCE_COMMIT" dist/
          (cd dist && sha256sum authorizer.wasm analysis.wasm cedar-go-wasm-source.zip SOURCE_COMMIT > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Verify and publish the tested files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(cat dist/SOURCE_COMMIT)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Tested modules and source bundle from $GITHUB_SHA. Verify SHA256SUMS and run: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
