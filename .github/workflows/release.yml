name: Release

# A tag such as v0.1.0 builds the modules from source, checks that they equal
# the committed modules, runs the tests, attests build provenance for the
# modules with Sigstore, and publishes a GitHub release.
#
# A manual run (workflow_dispatch) does everything except the release, to
# verify the workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CORPUS_COMMIT: 1999ea249229e26cabb398a279fea721854a471d
  CORPUS_SHA256: 65476adf952c0574d6bf9b317d67d30c9ac462eb1dbf5e4c7b2a35856baf5205

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Build the modules from source
        run: scripts/build-wasm.sh
      - name: The built modules must equal the committed ones
        run: git diff --exit-code -- internal/modules
      - name: Test, including the corpus
        run: |
          curl -sSfL -o corpus.tar.gz "https://raw.githubusercontent.com/cedar-policy/cedar-integration-tests/$CORPUS_COMMIT/corpus-tests.tar.gz"
          echo "$CORPUS_SHA256  corpus.tar.gz" | sha256sum --check
          mkdir corpus && tar xzf corpus.tar.gz -C corpus
          CEDAR_CORPUS_DIR="$PWD/corpus" go test -count=1 ./...
      - name: Collect the release files
        run: |
          mkdir dist
          cp internal/modules/authorizer/authorizer.wasm internal/modules/analysis/analysis.wasm dist/
          (cd dist && sha256sum *.wasm > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Modules built from source at $GITHUB_SHA. Verify them with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
