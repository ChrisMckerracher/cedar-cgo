name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-22.04
    permissions: { actions: read, contents: read }
    outputs:
      ci-run: ${{ steps.ci.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: ci
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          run=$(scripts/release/check-ci.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          echo "run=$run" >> "$GITHUB_OUTPUT"

  bundle:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux_arm64 }
          - { os: macos-15, target: aarch64-apple-darwin, platform: darwin_arm64 }
    runs-on: ${{ matrix.os }}
    permissions: { actions: read, contents: read, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.1" }
      - name: Download the exact tested main artifact
        env: { GH_TOKEN: "${{ github.token }}", CI_RUN: "${{ needs.gate.outputs.ci-run }}" }
        run: gh run download "$CI_RUN" --repo "$GITHUB_REPOSITORY" --name "native-${{ matrix.platform }}-$GITHUB_SHA" --dir "$RUNNER_TEMP/native-artifact"
      - run: scripts/install-native.sh "$RUNNER_TEMP/native-artifact" "$GITHUB_SHA" "${{ matrix.target }}"
      - run: scripts/test-inputs.sh "$RUNNER_TEMP/test-inputs" solver
      - name: Package and verify the exact native files
        run: |
          set -euo pipefail
          mkdir dist
          python3 scripts/package-consumer.py "$RUNNER_TEMP/native-artifact" "$GITHUB_SHA" "dist/cedar-go-wasm-${{ matrix.platform }}-source.zip"
          scripts/check-consumer.sh "dist/cedar-go-wasm-${{ matrix.platform }}-source.zip" "$GITHUB_SHA"
          python3 scripts/native/package-artifact.py "$RUNNER_TEMP/native-artifact" "dist/cedar-go-wasm-${{ matrix.platform }}-native.zip"
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.txt dist/
          cp "$RUNNER_TEMP/native-artifact/SOURCE_COMMIT" "dist/SOURCE_COMMIT-${{ matrix.platform }}"
          python3 scripts/release/checksums.py dist "SHA256SUMS-${{ matrix.platform }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { pattern: "dist-*", path: dist, merge-multiple: true }
      - name: Verify and publish the tested native files
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          for platform in linux_amd64 linux_arm64 darwin_arm64; do
            (cd dist && sha256sum --check "SHA256SUMS-$platform")
            test "$(cat "dist/SOURCE_COMMIT-$platform")" = "$GITHUB_SHA"
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Native libraries and consumer bundles from $GITHUB_SHA. Verify target SHA256SUMS and build attestations before extraction."
