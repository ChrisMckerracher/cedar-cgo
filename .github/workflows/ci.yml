name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  CORPUS_COMMIT: 1999ea249229e26cabb398a279fea721854a471d
  CORPUS_SHA256: 65476adf952c0574d6bf9b317d67d30c9ac462eb1dbf5e4c7b2a35856baf5205
  CVC5_URL: https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
  CVC5_SHA256: 1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_ABOUT_VERSION: 0.9.2
  GOVULNCHECK_VERSION: v1.8.0

defaults:
  run:
    shell: bash

jobs:
  native-build:
    name: Native artifact (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux_arm64 }
          - { os: macos-15, target: aarch64-apple-darwin, platform: darwin_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.x" }
      - run: rustup toolchain install && rustup target add "${{ matrix.target }}"
      - run: scripts/check-native-reproducibility.sh "$RUNNER_TEMP/native-artifact" "${{ matrix.target }}"
      - run: go run ./cmd/verify-native-artifact "$RUNNER_TEMP/native-artifact" "$GITHUB_SHA" "${{ matrix.target }}" internal/native/include/cedar.h
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-artifact/
          if-no-files-found: error

  go-test:
    needs: native-build
    name: Go tests (${{ matrix.platform }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, go: "1.26.x", target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
          - { os: ubuntu-22.04, go: "1.27.x", target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
          - { os: ubuntu-24.04-arm, go: "1.26.x", target: aarch64-unknown-linux-gnu, platform: linux_arm64 }
          - { os: ubuntu-24.04-arm, go: "1.27.x", target: aarch64-unknown-linux-gnu, platform: linux_arm64 }
          - { os: macos-15, go: "1.26.x", target: aarch64-apple-darwin, platform: darwin_arm64 }
          - { os: macos-15, go: "1.27.x", target: aarch64-apple-darwin, platform: darwin_arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "${{ matrix.go }}" }
      - uses: ./.github/actions/install-native
        with: { target: "${{ matrix.target }}", platform: "${{ matrix.platform }}" }
      - run: scripts/test-inputs.sh "$RUNNER_TEMP/test-inputs" solver
      - run: go vet ./...
      - name: Repository-wide gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
      - run: GOEXPERIMENT=cgocheck2 go test -count=1 ./...
      - run: python3 -m unittest discover -s scripts/consumer -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Verify independent prebuilt consumer
        run: |
          set -euo pipefail
          python3 scripts/package-consumer.py "$RUNNER_TEMP/native-artifact" "$GITHUB_SHA" "$RUNNER_TEMP/consumer.zip"
          scripts/check-consumer.sh "$RUNNER_TEMP/consumer.zip" "$GITHUB_SHA"

  corpus:
    needs: native-build
    name: Cedar corpus conformance and coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.x" }
      - uses: ./.github/actions/install-native
        with: { target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
      - run: scripts/test-inputs.sh "$RUNNER_TEMP/test-inputs" all
      - run: go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - run: python3 scripts/check-coverage.py coverage.out
      - run: go test -count=1 -run '^TestCorpus$' -v ./cedar/integration

  analysis:
    needs: native-build
    name: Analysis and native arithmetic proofs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.x" }
      - uses: ./.github/actions/install-native
        with: { target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
      - run: scripts/test-inputs.sh "$RUNNER_TEMP/test-inputs" solver
      - run: go test -count=1 -v ./analysis/... ./internal/verification

  fuzz:
    needs: native-build
    name: Fuzz every preserved target for 60 seconds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.x" }
      - uses: ./.github/actions/install-native
        with: { target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
      - run: scripts/fuzz-native.sh

  govulncheck:
    needs: native-build
    name: Go advisory check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.x" }
      - uses: ./.github/actions/install-native
        with: { target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
      - run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  rust:
    needs: native-build
    name: Rust, independent parity, licenses, and advisories
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.27.x" }
      - uses: ./.github/actions/install-native
        with: { target: x86_64-unknown-linux-gnu, platform: linux_amd64 }
      - run: rustup toolchain install
      - run: scripts/test-inputs.sh "$RUNNER_TEMP/test-inputs" solver
      - name: Install pinned maintenance tools
        run: |
          set -euo pipefail
          command -v cargo-deny || cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"
          command -v cargo-audit || cargo install --locked "cargo-audit@$CARGO_AUDIT_VERSION"
          command -v cargo-about || cargo install --locked --features cli "cargo-about@$CARGO_ABOUT_VERSION"
      - run: scripts/check-rust.sh
