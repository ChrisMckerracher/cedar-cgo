name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because new advisories can fail the audit jobs without a code change.
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  # Keep the cedar-integration-tests corpus aligned with Cedar 4.13.0.
  CORPUS_COMMIT: 1999ea249229e26cabb398a279fea721854a471d
  CORPUS_SHA256: 65476adf952c0574d6bf9b317d67d30c9ac462eb1dbf5e4c7b2a35856baf5205
  # Match the cvc5 version used by Cedar's SymCC tests.
  CVC5_URL: https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.1/cvc5-Linux-x86_64-static.zip
  CVC5_SHA256: 1a1cda20d2df4938fa4944a69f33ddc9172e319ece0eed0aa09c4d7abede3ed1
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_ABOUT_VERSION: 0.9.2
  GOVULNCHECK_VERSION: v1.8.0

defaults:
  run:
    shell: bash

jobs:
  go-test:
    name: Go tests (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, go: "1.26.x" }
          - { os: ubuntu-latest, go: "1.27.x" }
          - { os: ubuntu-24.04-arm, go: "1.27.x" }
          - { os: macos-latest, go: "1.27.x" }
          - { os: windows-latest, go: "1.27.x" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -count=1 ./...

  corpus:
    name: Cedar corpus conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Download the corpus
        run: |
          curl -sSfL -o corpus.tar.gz "https://raw.githubusercontent.com/cedar-policy/cedar-integration-tests/$CORPUS_COMMIT/corpus-tests.tar.gz"
          echo "$CORPUS_SHA256  corpus.tar.gz" | sha256sum --check
          mkdir corpus && tar xzf corpus.tar.gz -C corpus
      - name: Run the corpus through the Go API
        run: CEDAR_CORPUS_DIR="$PWD/corpus" go test -count=1 -run '^TestCorpus$' -v ./cedar

  analysis:
    name: Change analysis with cvc5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Download cvc5
        run: |
          curl -sSfL -o cvc5.zip "$CVC5_URL"
          echo "$CVC5_SHA256  cvc5.zip" | sha256sum --check
          unzip -q cvc5.zip
      - run: CVC5="$PWD/cvc5-Linux-x86_64-static/bin/cvc5" go test -count=1 -v ./analysis/
      - name: Prove the ABI arithmetic
        run: CVC5="$PWD/cvc5-Linux-x86_64-static/bin/cvc5" go test -count=1 -v ./internal/verification

  fuzz:
    name: Fuzz the boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Fuzz each target for 60 seconds
        run: |
          for target in FuzzAuthorize FuzzPolicies FuzzEntities FuzzBatchedEntities FuzzBatchedDifferential FuzzSliceEntities FuzzPolicySyntax FuzzPolicyEdits FuzzTemplates FuzzPartialEntities FuzzPartialReauthorize FuzzFormatPolicies FuzzUTF8Values FuzzEvalResult FuzzEntityLiteralSubstitution FuzzDiagnostics FuzzSchemaFragments FuzzEntityStoreUnrelatedDecisions FuzzNativeUIDRoundTrip; do
            go test -run '^$' -fuzz "^$target\$" -fuzztime 60s ./cedar
          done

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

  rust:
    name: Rust lint, licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Check the vendored SymCC against crates.io
        run: scripts/vendor-symcc.sh
      - working-directory: rust
        run: cargo fmt --all -- --check
      - working-directory: rust
        run: |
          cargo clippy --locked --release --target wasm32-wasip1 -p cgw-abi -p cgw-authorizer -p cgw-analysis -- -D warnings
          cargo clippy --locked --release -p cgw-native-bench -- -D warnings
          cargo clippy --locked --release -p cgw-authorizer --example template_fixtures -- -D warnings
      - name: Verify native slicing fixtures
        run: scripts/slicing-fixtures.sh --check
      - name: Policy construction native parity
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example policies_oracle -- -D warnings
          scripts/policies-parity.sh --check
      - name: Check native partial evaluation fixtures
        run: |
          cargo clippy --locked --release --manifest-path rust/Cargo.toml -p cgw-native-bench --example partial_fixture -- -D warnings
          scripts/partial-fixtures.sh --check
      - name: Native formatting parity and lint
        run: |
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example format_parity -- -D warnings
          scripts/format-parity.sh --check
      - name: Native validation depth parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example validation_depth -- -D warnings
          scripts/validation-depth-parity.sh --check
      - name: Native expression parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example expression_fixtures -- -D warnings
          scripts/expression-parity.sh --check
      - name: Native entity literal parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example literal_fixtures -- -D warnings
          scripts/literal-parity.sh --check
      - name: Native applicability parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example applicability_fixtures -- -D warnings
          scripts/applicability-parity.sh --check
      - name: Native diagnostic parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example diagnostic_fixtures -- -D warnings
          scripts/diagnostics-parity.sh --check
      - name: Native schema parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example schema_fixtures -- -D warnings
          scripts/schema-parity.sh --check

      - name: Native entity store parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example entity_store_fixtures -- -D warnings
          scripts/entity-store-parity.sh --check
      - name: Native utility parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example utility_fixtures -- -D warnings
          scripts/utility-parity.sh --check
      - name: Native permission query parity and lint
        run: |
          set -euo pipefail
          cargo clippy --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --example query_fixtures -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --release -p cgw-authorizer --lib queries::tests
          scripts/queries-parity.sh --check
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ env.CARGO_AUDIT_VERSION }}-${{ runner.os }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}
      - name: Install cargo-deny, cargo-audit and cargo-about
        run: |
          command -v cargo-deny || cargo install --locked "cargo-deny@$CARGO_DENY_VERSION"
          command -v cargo-audit || cargo install --locked "cargo-audit@$CARGO_AUDIT_VERSION"
          command -v cargo-about || cargo install --locked --features cli "cargo-about@$CARGO_ABOUT_VERSION"
      - working-directory: rust
        run: cargo clippy --offline --locked --release -p cgw-authorizer --example batched-oracle -- -D warnings
      - name: Check native batched fixtures
        run: |
          set -euo pipefail
          cargo run --offline --locked --release --manifest-path rust/Cargo.toml -p cgw-authorizer --example batched-oracle < testdata/parity/batched/input.json > /tmp/batched-expected.json
          diff -u testdata/parity/batched/expected.json /tmp/batched-expected.json
      - working-directory: rust
        run: cargo deny --all-features check
      - working-directory: rust
        run: cargo audit --deny warnings
      - name: THIRD_PARTY_LICENSES.txt must match rust/Cargo.lock
        run: |
          scripts/third-party-licenses.sh
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt

  wasm-reproducible:
    name: Rebuild the modules and compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: scripts/build-wasm.sh
      - name: The rebuilt modules must equal the committed ones
        run: git diff --exit-code -- internal/modules
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - name: Native template parity
        run: scripts/check-template-parity.sh
