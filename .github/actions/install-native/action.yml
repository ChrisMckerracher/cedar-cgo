name: Install verified native library
description: Verify the source, target, ABI, and header before installing the native library.
inputs:
  target:
    description: Rust target for the runner's C compiler and runtime.
    required: true
  platform:
    description: Go platform name for the native artifact.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: native-${{ inputs.platform }}-${{ github.sha }}
        path: ${{ runner.temp }}/native-artifact
    - name: Verify and install the native library
      shell: bash
      env:
        NATIVE_TARGET: ${{ inputs.target }}
      run: |
        set -euo pipefail
        scripts/install-native.sh "$RUNNER_TEMP/native-artifact" "$GITHUB_SHA" "$NATIVE_TARGET"
