name: Install verified Wasm
description: Verify the source commit and hashes before installing embedded modules.
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: wasm-${{ github.sha }}
        path: ${{ runner.temp }}/wasm-artifact
    - name: Verify and install the modules
      shell: bash
      run: |
        set -euo pipefail
        go run ./cmd/verify-wasm-artifact "$RUNNER_TEMP/wasm-artifact" "$GITHUB_SHA"
        for name in authorizer analysis; do
          cp "$RUNNER_TEMP/wasm-artifact/$name/$name.wasm" "internal/modules/$name/"
          cp "$RUNNER_TEMP/wasm-artifact/$name/sha256.go" "internal/modules/$name/"
        done
