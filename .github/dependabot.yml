# Rust lockfile updates require pinned-source CI builds and regenerated license notices; do not commit build outputs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    ignore:
      # Cedar and vendored SymCC must move together; follow CONTRIBUTING.md.
      - dependency-name: cedar-policy
      - dependency-name: cedar-policy-core
      - dependency-name: cedar-policy-symcc
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
