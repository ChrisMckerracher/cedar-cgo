# Dependabot opens pull requests. Nothing merges them automatically: a
# maintainer reviews each one, and a change to rust/Cargo.lock also needs
# scripts/build-wasm.sh, because CI compares the rebuilt modules with the
# committed ones.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    ignore:
      # A Cedar upgrade follows the procedure in CONTRIBUTING.md: it moves
      # cedar-policy and the vendored cedar-policy-symcc together.
      - dependency-name: cedar-policy
      - dependency-name: cedar-policy-core
      - dependency-name: cedar-policy-symcc
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
